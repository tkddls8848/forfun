[all]
k8s-master ansible_host=192.168.56.10 ip=192.168.56.10 ansible_ssh_private_key_file=/home/vagrant/.ssh/k8s-master_key
k8s-worker1 ansible_host=192.168.56.21 ip=192.168.56.21 ansible_ssh_private_key_file=/home/vagrant/.ssh/k8s-worker1_key
k8s-worker2 ansible_host=192.168.56.22 ip=192.168.56.22 ansible_ssh_private_key_file=/home/vagrant/.ssh/k8s-worker2_key
k8s-worker3 ansible_host=192.168.56.23 ip=192.168.56.23 ansible_ssh_private_key_file=/home/vagrant/.ssh/k8s-worker3_key

[kube_control_plane]
k8s-master

[etcd]
k8s-master

[kube_node]
k8s-worker1
k8s-worker2
k8s-worker3

[k8s_cluster:children]
kube_control_plane
kube_node

[all:vars]
ansible_user=vagrant
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
