<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gostore lab</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#252a34; --fg:#e6e9ef; --dim:#8b93a7;
    --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --accent:#60a5fa;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size:14px; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.02em; }
  header .sub { color:var(--dim); font-size:12px; font-family:var(--mono); }
  main { padding:20px; max-width:1200px; margin:0 auto; display:grid; gap:20px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  section > h2 { font-size:13px; margin:0; padding:10px 14px; border-bottom:1px solid var(--line);
                 color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.08em; }
  .body { padding:14px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12.5px; white-space:nowrap; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  tr:last-child td { border-bottom:none; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  .err { color:var(--bad); font-family:var(--mono); font-size:12px; white-space:pre-wrap; }
  .dim { color:var(--dim); }
  label { color:var(--dim); font-size:12px; display:inline-flex; align-items:center; gap:6px; }
  input, select, button {
    background:#0b0d11; color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:6px 9px; font-family:var(--mono); font-size:12.5px;
  }
  input[type=number] { width:80px; } input[type=checkbox] { width:auto; }
  button { cursor:pointer; border-color:#33405c; background:#1b2436; }
  button:hover:not(:disabled) { background:#243149; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .controls { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .bar { height:6px; background:#0b0d11; border-radius:3px; overflow:hidden; min-width:70px; }
  .bar > span { display:block; height:100%; background:var(--accent); }
  .note { color:var(--dim); font-size:11.5px; padding:0 14px 12px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>gostore lab</h1>
  <span class="sub" id="hdr">단일 정적 바이너리 · 외부 의존성 0</span>
</header>

<main>
  <section>
    <h2>노드</h2>
    <div class="body"><table id="nodes">
      <thead><tr>
        <th>노드</th><th>백엔드</th><th>주소</th><th>FS</th>
        <th class="num">사용</th><th class="num">여유</th><th class="num">RTT</th><th>상태</th>
      </tr></thead><tbody><tr><td colspan="8" class="dim">불러오는 중…</td></tr></tbody>
    </table></div>
  </section>

  <section>
    <h2>벤치마크</h2>
    <div class="body">
      <div class="controls">
        <label>모드
          <select id="mode">
            <option value="mixed">mixed (읽기3:쓰기1)</option>
            <option value="write">write</option>
            <option value="read">read</option>
          </select>
        </label>
        <label>동시성 <input type="number" id="concurrency" value="16" min="1" max="512"></label>
        <label>시간(초) <input type="number" id="seconds" value="10" min="1" max="600"></label>
        <label>페이로드(KB) <input type="number" id="payload" value="64" min="1" max="65536"></label>
        <label><input type="checkbox" id="fsync"> fsync</label>
        <button id="run">실행</button>
        <span class="dim" id="benchState"></span>
      </div>
    </div>
    <p class="note">
      모든 노드에서 <b>동시에</b> 부하를 건다. 순차 실행이면 공유 백엔드에 대한
      경합이 사라져 실제 운영 상황과 달라진다. fsync 를 끄면 페이지 캐시 지연을,
      켜면 스토리지까지 내려가는 지연을 잰다.
    </p>
    <div class="body"><table id="bench">
      <thead><tr>
        <th>노드</th><th>백엔드</th><th class="num">ops</th><th class="num">err</th>
        <th class="num">op/s</th><th class="num">MB/s</th>
        <th class="num">p50</th><th class="num">p95</th><th class="num">p99</th>
        <th class="num">p99.9</th><th class="num">max</th><th>p99 비교</th>
      </tr></thead><tbody><tr><td colspan="12" class="dim">실행 전</td></tr></tbody>
    </table></div>
  </section>

  <section>
    <h2>파일</h2>
    <div class="body">
      <div class="controls">
        <label>노드 <select id="fileNode"></select></label>
        <input type="file" id="upload">
        <button id="uploadBtn">업로드</button>
        <span class="dim" id="fileState"></span>
      </div>
    </div>
    <div class="body"><table id="files">
      <thead><tr><th>노드</th><th>이름</th><th class="num">크기</th><th>수정</th><th></th></tr></thead>
      <tbody><tr><td colspan="5" class="dim">불러오는 중…</td></tr></tbody>
    </table></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const fmtBytes = (b) => {
  if (b === null || b === undefined) return "-";
  const u = ["B","KiB","MiB","GiB","TiB","PiB"];
  let i = 0, v = Number(b);
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(i === 0 ? 0 : 1) + " " + u[i];
};
const fmtMs = (v) => (v === null || v === undefined) ? "-" : Number(v).toFixed(2);
const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(body && body.error ? body.error : `HTTP ${r.status}`);
  return body;
}

async function loadNodes() {
  const tbody = $("#nodes tbody");
  try {
    const { nodes } = await api("/api/nodes");
    tbody.innerHTML = nodes.map(n => {
      const u = n.usage || {};
      const pct = u.total_bytes ? (u.used_bytes / u.total_bytes * 100) : 0;
      return `<tr>
        <td><span class="dot ${n.ok ? "ok" : "bad"}"></span>${esc(n.name)}</td>
        <td>${esc(n.backend || "-")}</td>
        <td class="dim">${esc(n.addr)}</td>
        <td>${esc(u.fs_type || "-")}</td>
        <td class="num">${u.total_bytes ? fmtBytes(u.used_bytes) + " / " + fmtBytes(u.total_bytes) : "-"}</td>
        <td class="num">${u.free_bytes ? fmtBytes(u.free_bytes) : "-"}</td>
        <td class="num">${fmtMs(n.latency_ms)} ms</td>
        <td>${n.ok
            ? `<div class="bar" title="${pct.toFixed(1)}% 사용"><span style="width:${pct.toFixed(1)}%"></span></div>`
            : `<span class="err">${esc(n.error || "unreachable")}</span>`}</td>
      </tr>`;
    }).join("");

    const sel = $("#fileNode");
    const cur = sel.value;
    sel.innerHTML = nodes.map(n => `<option value="${esc(n.name)}">${esc(n.name)}</option>`).join("");
    if (cur) sel.value = cur;
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="8" class="err">${esc(e.message)}</td></tr>`;
  }
}

async function loadFiles() {
  const tbody = $("#files tbody");
  try {
    const { nodes } = await api("/api/files");
    const rows = [];
    for (const n of nodes) {
      if (n.error) {
        rows.push(`<tr><td>${esc(n.node)}</td><td colspan="4" class="err">${esc(n.error)}</td></tr>`);
        continue;
      }
      for (const f of n.files) {
        rows.push(`<tr>
          <td>${esc(n.node)}</td>
          <td>${esc(f.name)}</td>
          <td class="num">${fmtBytes(f.size)}</td>
          <td class="dim">${esc(new Date(f.modified).toLocaleString())}</td>
          <td>
            <a href="/api/files/${encodeURIComponent(n.node)}/${encodeURIComponent(f.name)}" download>받기</a>
            &nbsp;<button data-node="${esc(n.node)}" data-name="${esc(f.name)}" class="del">삭제</button>
          </td></tr>`);
      }
    }
    tbody.innerHTML = rows.length ? rows.join("") : `<tr><td colspan="5" class="dim">파일 없음</td></tr>`;
    tbody.querySelectorAll("button.del").forEach(b => b.onclick = async () => {
      b.disabled = true;
      try {
        await api(`/api/files/${encodeURIComponent(b.dataset.node)}/${encodeURIComponent(b.dataset.name)}`,
                  { method: "DELETE" });
        loadFiles();
      } catch (e) { $("#fileState").textContent = e.message; b.disabled = false; }
    });
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5" class="err">${esc(e.message)}</td></tr>`;
  }
}

$("#uploadBtn").onclick = async () => {
  const f = $("#upload").files[0];
  const node = $("#fileNode").value;
  if (!f || !node) { $("#fileState").textContent = "노드와 파일을 선택하세요"; return; }
  $("#fileState").textContent = "업로드 중…";
  try {
    await api(`/api/files/${encodeURIComponent(node)}/${encodeURIComponent(f.name)}`,
              { method: "PUT", body: f });
    $("#fileState").textContent = "완료";
    $("#upload").value = "";
    loadFiles(); loadNodes();
  } catch (e) { $("#fileState").textContent = e.message; }
};

$("#run").onclick = async () => {
  const btn = $("#run");
  const body = {
    mode: $("#mode").value,
    concurrency: Number($("#concurrency").value),
    seconds: Number($("#seconds").value),
    payload_kb: Number($("#payload").value),
    fsync: $("#fsync").checked,
  };
  btn.disabled = true;
  const t0 = Date.now();
  const tick = setInterval(() => {
    $("#benchState").textContent = `실행 중… ${((Date.now() - t0) / 1000).toFixed(0)}s`;
  }, 500);
  const tbody = $("#bench tbody");
  tbody.innerHTML = `<tr><td colspan="12" class="dim">측정 중…</td></tr>`;
  try {
    const { results } = await api("/api/bench", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const worst = Math.max(...results.filter(r => !r.error).map(r => r.result.p99_ms), 0);
    tbody.innerHTML = results.map(r => {
      if (r.error) return `<tr><td>${esc(r.node)}</td><td colspan="11" class="err">${esc(r.error)}</td></tr>`;
      const x = r.result;
      const w = worst > 0 ? (x.p99_ms / worst * 100) : 0;
      return `<tr>
        <td>${esc(r.node)}</td><td>${esc(r.backend || "-")}</td>
        <td class="num">${x.ops}</td>
        <td class="num" ${x.errors ? 'style="color:var(--bad)"' : ""}>${x.errors}</td>
        <td class="num">${x.ops_per_sec.toFixed(0)}</td>
        <td class="num">${x.throughput_mbps ? x.throughput_mbps.toFixed(1) : "-"}</td>
        <td class="num">${fmtMs(x.p50_ms)}</td><td class="num">${fmtMs(x.p95_ms)}</td>
        <td class="num">${fmtMs(x.p99_ms)}</td><td class="num">${fmtMs(x.p999_ms)}</td>
        <td class="num">${fmtMs(x.max_ms)}</td>
        <td><div class="bar" title="p99 ${fmtMs(x.p99_ms)} ms"><span style="width:${w.toFixed(1)}%"></span></div></td>
      </tr>`;
    }).join("");
    $("#benchState").textContent = "완료";
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="12" class="err">${esc(e.message)}</td></tr>`;
    $("#benchState").textContent = "";
  } finally { clearInterval(tick); btn.disabled = false; }
};

loadNodes(); loadFiles();
setInterval(loadNodes, 5000);
</script>
</body>
</html>
