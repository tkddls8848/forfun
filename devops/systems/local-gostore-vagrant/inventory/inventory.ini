# local-gostore-vagrant 인벤토리
#
# 이 파일이 랩 구성의 단일 소스(single source of truth)다.
# Vagrantfile 과 배포 스크립트는 값을 다시 하드코딩하지 않고 여기서 읽는다.
#
# 호스트 줄 형식:
#   <hostname> ansible_host=<IP> [store_dir=<경로>] [backend=<라벨>] [data_disk=<크기GB>]
#
# backend 는 표시용 라벨이다. 에이전트가 statfs 로 판별한 실제 파일시스템은
# UI 의 FS 열에 따로 나오므로, 라벨과 실제가 어긋나면 화면에서 바로 드러난다.

[control]
gostore-control ansible_host=192.168.60.10

[storage]
gostore-node-1 ansible_host=192.168.60.11 store_dir=/srv/gostore backend=xfs-disk    data_disk=10
gostore-node-2 ansible_host=192.168.60.12 store_dir=/srv/gostore backend=ext4-disk   data_disk=10
gostore-node-3 ansible_host=192.168.60.13 store_dir=/srv/gostore backend=tmpfs-ram   data_disk=0

[all:vars]
# 랩 네트워크. /24 만 지원한다.
lab_network=192.168.60.0/24
# 에이전트/컨트롤러 리스닝 포트.
agent_port=4000
control_port=3333
# 컨트롤러와 에이전트가 공유하는 시크릿.
# 실습용 기본값이다. 랩 밖으로 나갈 구성이라면 반드시 바꿀 것.
gostore_token=lab-shared-secret-change-me
